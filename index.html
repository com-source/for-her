<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💙💖</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
body{font-family:Poppins;margin:0;background:linear-gradient(135deg,#dbeafe,#ffe4f0)}
header{text-align:center;padding:1.5rem;color:#fff;background:linear-gradient(135deg,#4da6ff,#ff4d8d)}
.container{max-width:1000px;margin:auto;padding:10px}
.card{background:#fff;border-radius:15px;padding:15px;margin:15px 0;box-shadow:0 8px 20px rgba(0,0,0,0.08)}
.table-wrapper{overflow-x:auto}
.table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}
.table th,.table td{border:1px solid #eee;padding:6px;text-align:center}
button{border:none;border-radius:6px;padding:5px 8px;background:#eee;cursor:pointer}
button.active{background:linear-gradient(135deg,#4da6ff,#ff4d8d);color:#fff}
input{width:90px;padding:6px;border-radius:8px;border:1px solid #ddd}
.progress{height:12px;background:#eee;border-radius:20px;overflow:hidden;margin-bottom:10px}
.bar{height:100%;width:0%;background:linear-gradient(135deg,#4da6ff,#ff4d8d)}
.good{background:#e6ffe6}
.bad{background:#ffe6e6}

@media (max-width:600px){
  header h1{font-size:1.5rem}
  .card{padding:10px}
  input{width:70px;font-size:10px}
  button{padding:4px 6px;font-size:10px}
}
</style>
</head>
<body>

<header>
<h1>Hey Suryakshi 💖</h1>
<p style="font-size:12px">Your glow-up tracker 💙</p>
</header>

<div class="container">

<div class="card">
<h2>📅 30 Day Tracker</h2>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="table-wrapper">
<table class="table" id="tracker">
<tr>
<th>Day</th>
<th>Date</th>
<th>Morning</th>
<th>Breakfast</th>
<th>Lunch</th>
<th>Snack</th>
<th>Dinner</th>
<th>💧</th>
<th>Sleep</th>
<th>Exercise</th>
<th>Min</th>
<th>Weight</th>
</tr>
</table>
</div>
</div>

</div>

<script>
const table=document.getElementById('tracker');
let total=30*3; // only Morning, Water, Sleep buttons

function update(){
 let active=document.querySelectorAll('.active').length;
 let percent=(active/total)*100;
 document.getElementById('bar').style.width=percent+'%';
 saveAll();
 updateRowColors();
}

function saveAll(){
 let data={buttons:[],inputs:[]};
 document.querySelectorAll('.track').forEach(b=>data.buttons.push(b.classList.contains('active')));
 document.querySelectorAll('input').forEach(inp=>data.inputs.push(inp.value));
 localStorage.setItem('trackerData',JSON.stringify(data));
}

function load(){
 let data=JSON.parse(localStorage.getItem('trackerData'));
 if(!data) return;
 document.querySelectorAll('.track').forEach((b,i)=>{if(data.buttons[i]) b.classList.add('active')});
 document.querySelectorAll('input').forEach((inp,i)=>{inp.value=data.inputs[i]||''});
 update();
}

function updateRowColors(){
 for(let i=1;i<=30;i++){
  let row=document.querySelector(`#tracker tr:nth-child(${i+1})`);
  let buttons=row.querySelectorAll('.track');
  let allDone=[...buttons].every(b=>b.classList.contains('active'));
  row.classList.remove('good','bad');
  if(allDone) row.classList.add('good');
  else if([...buttons].some(b=>b.classList.contains('active'))) row.classList.add('bad');
 }
}

const dates=["May 1","May 2","May 3","May 4","May 5","May 6","May 7","May 8","May 9","May 10","May 11","May 12","May 13","May 14","May 15","May 16","May 17","May 18","May 19","May 20","May 21","May 22","May 23","May 24","May 25","May 26","May 27","May 28","May 29","May 30"];

for(let i=1;i<=30;i++){
 let r=table.insertRow();
 r.insertCell(0).innerText=i;
 r.insertCell(1).innerText=dates[i-1];

 // Morning button
 let c1=r.insertCell(2);
 let b1=document.createElement('button');
 b1.innerText='✓';
 b1.classList.add('track');
 b1.onclick=()=>{b1.classList.toggle('active');update()};
 c1.appendChild(b1);

 // Inputs for meals
 let bf=r.insertCell(3);
 let i1=document.createElement('input'); i1.placeholder='Breakfast'; i1.oninput=saveAll; bf.appendChild(i1);

 let l=r.insertCell(4);
 let i2=document.createElement('input'); i2.placeholder='Lunch'; i2.oninput=saveAll; l.appendChild(i2);

 let s=r.insertCell(5);
 let i3=document.createElement('input'); i3.placeholder='Snack'; i3.oninput=saveAll; s.appendChild(i3);

 let d=r.insertCell(6);
 let i4=document.createElement('input'); i4.placeholder='Dinner'; i4.oninput=saveAll; d.appendChild(i4);

 // Water button
 let c2=r.insertCell(7);
 let b2=document.createElement('button');
 b2.innerText='✓'; b2.classList.add('track');
 b2.onclick=()=>{b2.classList.toggle('active');update()};
 c2.appendChild(b2);

 // Sleep button
 let c3=r.insertCell(8);
 let b3=document.createElement('button');
 b3.innerText='✓'; b3.classList.add('track');
 b3.onclick=()=>{b3.classList.toggle('active');update()};
 c3.appendChild(b3);

 // Exercise input
 let ex=r.insertCell(9);
 let i5=document.createElement('input'); i5.placeholder='Run'; i5.oninput=saveAll; ex.appendChild(i5);

 // Duration
 let dur=r.insertCell(10);
 let i6=document.createElement('input'); i6.placeholder='30'; i6.oninput=saveAll; dur.appendChild(i6);

 // Weight (replaces Notes)
 let weight=r.insertCell(11);
 let i7=document.createElement('input'); i7.placeholder='kg'; i7.oninput=saveAll; weight.appendChild(i7);
}

load();
</script>

</body>
</html>
